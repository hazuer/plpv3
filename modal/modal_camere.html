<style>
    /* =========================
       MODAL
    ========================= */

    #modal-ocr-camera .modal-dialog {
        max-width: 95%;
        width: 95%;
    }

    #modal-ocr-camera .modal-body {
        padding: 10px;
    }

    /* =========================
       LAYOUT 3 SECCIONES
    ========================= */

    .ocr-layout {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
    }

    .ocr-section {
        width: 100%;
        border: 1px solid #dcdcdc;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
    }

    /* =========================
       30% CAMARA
    ========================= */

    .ocr-camera-section {
        height: 35vh;
        min-height: 220px;
    }

    #video-container-ocr-camera {
        position: relative;
        width: 100%;
        height: 100%;
    }

    #video-ocr-camera {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: black;
    }

    /* Overlay OCR */

    #ocr-overlay {
        position: absolute;
        top: 28%;
        left: 3%;
        width: 93%;
        height: 45%;
        border: 3px solid #00ff88;
        border-radius: 10px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        pointer-events: none;
    }

    #ocr-overlay-label {
        position: absolute;
        top: 5%;
        left: 10%;

        color: #00ff88;
        font-size: 14px;
        font-weight: bold;

        background: rgba(0, 0, 0, 0.6);

        padding: 4px 10px;
        border-radius: 6px;
    }

    /* =========================
       40% PREVIEW
    ========================= */

    .ocr-preview-section {
        height: 40vh;
        min-height: 260px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #f5f5f5;
    }

    #canvas-ocr-camera {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
        background: white;
    }

    /* =========================
       30% DATOS
    ========================= */

    .ocr-data-section {
        height: 30vh;
        min-height: 220px;

        padding: 15px;
        overflow-y: auto;
    }

    .ocr-data-item {
        margin-bottom: 15px;
    }

    .ocr-data-label {
        font-weight: bold;
        color: #444;
        margin-bottom: 4px;
    }

    .ocr-data-value {
        padding: 10px;
        background: #f8f8f8;
        border-radius: 6px;
        border: 1px solid #ddd;
        min-height: 45px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:768px) {

        .ocr-camera-section {
            height: 28vh;
        }

        .ocr-preview-section {
            height: 25vh;
            min-height: 180px;

            display: flex;
            flex-direction: column;

            padding: 10px;
            background: #f5f5f5;
        }

        .ocr-data-section {
            height: 28vh;
        }

    }
</style>

<div class="modal fade" id="modal-ocr-camera" tabindex="-1" role="dialog" aria-hidden="true">

    <div class="modal-dialog modal-lg" role="document">

        <div class="modal-content">

            <div class="modal-header">

                <h3 class="modal-title">
                    <span id="modal-ocr-title"></span>
                </h3>

                <button id="btn-stop-ocr-camera" type="button" class="close" data-dismiss="modal">

                    <span>&times;</span>

                </button>

            </div>

            <div class="modal-body">

                <div class="ocr-layout">

                    <!-- =========================
                         CAMARA 30%
                    ========================== -->

                    <div class="ocr-section ocr-camera-section">

                        <div id="video-container-ocr-camera">

                            <video id="video-ocr-camera" autoplay playsinline>
                            </video>

                            <div id="ocr-overlay"></div>

                            <div id="ocr-overlay-label">
                                Coloque destinatario aquí
                            </div>

                        </div>

                    </div>

                    <!-- =========================
                         PREVIEW 40%
                    ========================== -->

                    <div class="ocr-section ocr-preview-section">

                        <div class="ocr-preview-container">

                            <canvas id="canvas-ocr-camera"></canvas>

                        </div>

                        <div class="ocr-preview-actions">

                            <button id="btn-capture-ocr" type="button" class="btn btn-success btn-lg">

                                Capturar

                            </button>

                        </div>

                    </div>

                    <!-- =========================
                         DATOS 30%
                    ========================== -->

                    <div class="ocr-section ocr-data-section">

                        <div class="ocr-data-item">
                            <div class="ocr-data-label">QR:</div>
                            <div class="ocr-data-value" id="ocr-qr">
                                ---
                            </div>
                        </div>

                        <div class="ocr-data-item">
                            <div class="ocr-data-label">Nombre:</div>
                            <div class="ocr-data-value" id="ocr-name">
                                ---
                            </div>
                        </div>

                        <div class="ocr-data-item">
                            <div class="ocr-data-label">Teléfono:</div>
                            <div class="ocr-data-value" id="ocr-phone">
                                ---
                            </div>
                        </div>

                        <div class="ocr-data-item">
                            <div class="ocr-data-label">Dirección:</div>
                            <div class="ocr-data-value" id="ocr-address">
                                ---
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
