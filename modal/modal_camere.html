<style>
    /* =========================
       MODAL
    ========================= */
    #modal-ocr-camera .modal-dialog {
        max-width: 95%;
        width: 95%;
    }

    #modal-ocr-camera .modal-body {
        padding: 10px;
    }

    /* =========================
       LAYOUT 3 SECCIONES
    ========================= */
    .ocr-layout {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
    }

    .ocr-section {
        width: 100%;
        border: 1px solid #dcdcdc;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
    }

    /* =========================
       25% CAMARA
    ========================= */
    .ocr-camera-section {
        height: 25vh;
        min-height: 200px;
    }

    #video-container-ocr-camera {
        position: relative;
        width: 100%;
        height: 100%;
    }

    #video-ocr-camera {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: black;
    }

    /* Overlay OCR */

    #ocr-overlay {
        position: absolute;
        top: 28%;
        left: 3%;
        width: 93%;
        height: 45%;
        border: 3px solid #00ff88;
        border-radius: 10px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        pointer-events: none;
    }

    #ocr-overlay-label {
        position: absolute;
        top: 5%;
        left: 10%;

        color: #00ff88;
        font-size: 14px;
        font-weight: bold;

        background: rgba(0, 0, 0, 0.6);

        padding: 4px 10px;
        border-radius: 6px;
    }

    /* =========================
       45% PREVIEW
    ========================= */

    .ocr-preview-section {
        height: 45vh;
        min-height: 320px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: #f5f5f5;
        padding: 15px;
    }

    .ocr-preview-container {
        width: 100%;
        flex: 1;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    #canvas-ocr-camera {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
        background: white;
    }

    .ocr-preview-actions {
        width: 100%;
        margin-top: 15px;

        display: flex;
        justify-content: center;
    }

    /* =========================
       30% DATOS
    ========================= */

    .ocr-data-section {
        height: 30vh;
        min-height: 240px;

        padding: 15px;
        overflow-y: auto;
    }

    .ocr-data-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .ocr-data-item {
        display: flex;
        flex-direction: column;
    }

    .ocr-data-item.full-width {
        grid-column: span 2;
    }

    .ocr-data-label {
        font-weight: bold;
        color: #444;
        margin-bottom: 4px;
    }

    .ocr-data-value {
        padding: 10px;
        background: #f8f8f8;
        border-radius: 6px;
        border: 1px solid #ddd;
        min-height: 45px;
    }

    .ocr-save-container {
        margin-top: 20px;

        display: flex;
        justify-content: flex-end;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:768px) {

        .ocr-camera-section {
            height: 22vh;
        }

        .ocr-preview-section {
            height: 38vh;
            min-height: 240px;
        }

        .ocr-data-section {
            height: auto;
            min-height: auto;
        }

        .ocr-data-grid {
            grid-template-columns: 1fr;
        }

        .ocr-data-item.full-width {
            grid-column: span 1;
        }

        .ocr-save-container {
            justify-content: center;
        }
    }
</style>

<div class="modal fade" id="modal-ocr-camera" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h3 class="modal-title">
                    <span id="modal-ocr-title"></span>
                </h3>

                <button id="btn-stop-ocr-camera" type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>

            <div class="modal-body">

                <div class="ocr-layout">

                    <!-- =========================
                         CAMARA 25%
                    ========================== -->
                    <div class="ocr-section ocr-camera-section">

                        <div id="video-container-ocr-camera">

                            <video id="video-ocr-camera" autoplay playsinline>
                            </video>

                            <div id="ocr-overlay"></div>

                            <div id="ocr-overlay-label">
                                Coloque destinatario aquí
                            </div>

                        </div>

                    </div>

                    <!-- =========================
                         PREVIEW 45%
                    ========================== -->
                    <div class="ocr-section ocr-preview-section">

                        <div class="ocr-preview-container">
                            <canvas id="canvas-ocr-camera"></canvas>
                        </div>

                        <div class="ocr-preview-actions">
                            <button id="btn-capture-ocr" type="button" class="btn btn-success btn-lg">
                                Capturar
                            </button>
                        </div>

                    </div>

                    <!-- =========================
                         DATOS 30%
                    ========================== -->
                    <div class="ocr-section ocr-data-section">

                        <div class="ocr-data-grid">

                            <div class="ocr-data-item">
                                <div class="ocr-data-label">
                                    QR:
                                </div>

                                <div class="ocr-data-value" id="ocr-qr">
                                    ---
                                </div>
                            </div>

                            <div class="ocr-data-item">
                                <div class="ocr-data-label">
                                    Nombre:
                                </div>

                                <div class="ocr-data-value" id="ocr-name">
                                    ---
                                </div>
                            </div>

                            <div class="ocr-data-item">
                                <div class="ocr-data-label">
                                    Teléfono:
                                </div>

                                <div class="ocr-data-value" id="ocr-phone">
                                    ---
                                </div>
                            </div>

                            <div class="ocr-data-item full-width">
                                <div class="ocr-data-label">
                                    Dirección:
                                </div>

                                <div class="ocr-data-value" id="ocr-address">
                                    ---
                                </div>
                            </div>

                        </div>

                        <div class="ocr-save-container">
                            <button id="btn-save-ocr" type="button" class="btn btn-primary btn-lg">
                                Guardar
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
